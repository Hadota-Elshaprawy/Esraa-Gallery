<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Esraa Gallery - عالم الهدايا الراقية 💝</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0d0914; color: #f3e8ff; }
        .glass-nav { background: rgba(19, 13, 29, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(236, 72, 153, 0.2); }
        .glass-card { background: rgba(26, 17, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(236, 72, 153, 0.15); transition: all 0.3s ease; }
        .glass-card:hover { border-color: rgba(236, 72, 153, 0.5); transform: translateY(-4px); box-shadow: 0 10px 30px -10px rgba(236, 72, 153, 0.3); }
        .btn-gradient { background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%); transition: opacity 0.2s; }
        .btn-gradient:hover { opacity: 0.9; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white">

    <!-- الهيدر -->
    <header class="glass-nav sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-3xl">💝</span>
                <h1 class="text-xl md:text-2xl font-black bg-gradient-to-r from-pink-400 via-purple-300 to-indigo-400 bg-clip-text text-transparent">Esraa Gallery</h1>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleLanguage()" id="langBtn" class="bg-slate-900 border border-pink-500/30 text-pink-300 px-3.5 py-2 rounded-2xl text-xs font-bold transition hover:bg-pink-500/10">
                    <i class="fa-solid fa-globe"></i> <span id="langBtnText">English</span>
                </button>
                <button onclick="toggleCart()" class="btn-gradient relative text-white px-4 py-2.5 rounded-2xl font-bold flex items-center gap-2 shadow-lg shadow-pink-500/25">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span id="cartText">السلة</span>
                    <span id="cartCount" class="bg-white text-pink-600 text-xs font-black px-2 py-0.5 rounded-full shadow">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- البانر والبحث -->
    <div class="max-w-6xl mx-auto px-4 pt-8 space-y-4">
        <div class="bg-gradient-to-r from-pink-950/40 via-purple-950/40 to-slate-900 border border-pink-500/20 rounded-3xl p-6 md:p-8 text-center relative overflow-hidden">
            <div class="absolute -right-10 -top-10 w-40 h-40 bg-pink-500/10 rounded-full blur-3xl"></div>
            <h2 id="bannerTitle" class="text-xl md:text-2xl font-black mb-4 text-pink-300">جمعنا كل ما هو جميل هنا لك انت</h2>
            
            <div class="max-w-md mx-auto">
                <input type="text" id="searchInput" oninput="filterProducts()" placeholder="ابحثي عن هدية معينة... 🔍" class="w-full bg-slate-900/90 border border-pink-500/30 rounded-2xl px-4 py-3 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-pink-500 shadow-inner">
            </div>
        </div>

        <!-- التصنيفات الأربعة -->
        <div class="flex flex-wrap justify-center gap-2 pt-2" id="categoryButtons">
            <button onclick="filterCategory('all', this)" class="cat-btn bg-pink-600 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow" data-cat="all">الكل</button>
            <button onclick="filterCategory('رجالي', this)" class="cat-btn bg-slate-900 border border-pink-500/20 text-slate-300 px-4 py-2 rounded-xl text-xs font-bold transition hover:bg-pink-500/10" data-cat="رجالي">👔 رجالي</button>
            <button onclick="filterCategory('حريمي', this)" class="cat-btn bg-slate-900 border border-pink-500/20 text-slate-300 px-4 py-2 rounded-xl text-xs font-bold transition hover:bg-pink-500/10" data-cat="حريمي">👜 حريمي</button>
            <button onclick="filterCategory('ديكور', this)" class="cat-btn bg-slate-900 border border-pink-500/20 text-slate-300 px-4 py-2 rounded-xl text-xs font-bold transition hover:bg-pink-500/10" data-cat="ديكور">🖼️ ديكور</button>
            <button onclick="filterCategory('اخري', this)" class="cat-btn bg-slate-900 border border-pink-500/20 text-slate-300 px-4 py-2 rounded-xl text-xs font-bold transition hover:bg-pink-500/10" data-cat="اخري">🎁 أخرى</button>
        </div>
    </div>

    <!-- شبكة المنتجات -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
        <div id="loading" class="text-center py-20 text-pink-400 text-xl font-bold animate-pulse">جاري تحميل الهدايا الساحرة... 🎁</div>
        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <!-- نافذة تكبير الصورة (Lightbox) -->
    <div id="imageModal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden z-50 flex items-center justify-center p-4" onclick="closeImageModal()">
        <div class="relative max-w-4xl max-h-[90vh] flex flex-col items-center" onclick="event.stopPropagation()">
            <button onclick="closeImageModal()" class="absolute -top-12 left-0 text-white text-3xl hover:text-pink-400 transition">&times; <span id="closeText">إغلاق</span></button>
            <img id="modalImage" src="" alt="Zoomed Image" class="max-w-full max-h-[80vh] object-contain rounded-2xl border border-pink-500/30 shadow-2xl">
        </div>
    </div>

    <!-- نافذة السلة وإتمام الطلب -->
    <div id="cartModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="glass-card rounded-3xl w-full max-w-lg max-h-[90vh] flex flex-col shadow-2xl">
            <div class="p-5 border-b border-pink-500/20 flex justify-between items-center">
                <h2 id="cartModalTitle" class="text-xl font-bold text-pink-300 flex items-center gap-2"><i class="fa-solid fa-gift"></i> سلة المشتريات</h2>
                <button onclick="toggleCart()" class="text-slate-400 hover:text-white text-2xl font-bold w-8 h-8 rounded-full flex items-center justify-center bg-white/5">&times;</button>
            </div>
            
            <div id="cartItems" class="p-5 overflow-y-auto flex-1 space-y-4"></div>

            <div class="p-5 border-t border-pink-500/20 bg-purple-950/20 space-y-4">
                <div class="flex gap-2">
                    <input type="text" id="couponInput" placeholder="ادخل كود الخصم" class="flex-1 bg-slate-900/80 border border-pink-500/30 rounded-xl px-3 py-2 text-xs text-white uppercase placeholder-slate-500 focus:outline-none focus:border-pink-500">
                    <button onclick="applyCoupon()" id="couponBtn" class="bg-pink-600/30 hover:bg-pink-600 text-pink-300 hover:text-white px-4 py-2 rounded-xl text-xs font-bold transition border border-pink-500/30">تطبيق الخصم</button>
                </div>
                <div id="couponMsg" class="text-xs font-semibold text-emerald-400 hidden"></div>

                <div class="space-y-1">
                    <div class="flex justify-between text-sm text-slate-300">
                        <span id="subtotalLabel">المجموع الفرعي:</span>
                        <span id="subtotalAmount">0 ج.م</span>
                    </div>
                    <div id="discountRow" class="flex justify-between text-sm text-pink-400 hidden">
                        <span id="discountLabel">قيمة الخصم:</span>
                        <span id="discountAmount">-0 ج.م</span>
                    </div>
                    <div class="flex justify-between text-lg font-black pt-1 border-t border-pink-500/10">
                        <span id="totalLabel" class="text-slate-200">الإجمالي الكلي:</span>
                        <span id="cartTotal" class="text-pink-400">0 ج.م</span>
                    </div>
                </div>
                
                <div class="space-y-3">
                    <input type="text" id="custName" placeholder="الاسم بالكامل 👤" class="w-full bg-slate-900/80 border border-pink-500/30 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-500 text-white placeholder-slate-500">
                    <input type="tel" id="custPhone" maxlength="11" placeholder="رقم الموبايل (01111111111) 📱" class="w-full bg-slate-900/80 border border-pink-500/30 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-500 text-white placeholder-slate-500">
                    <input type="text" id="custAddress" placeholder="العنوان بالتفصيل 📍" class="w-full bg-slate-900/80 border border-pink-500/30 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-500 text-white placeholder-slate-500">
                </div>
                
                <button onclick="submitOrder()" id="orderBtn" class="w-full btn-gradient py-3.5 rounded-xl font-bold text-white shadow-lg shadow-pink-500/20 transition">
                    تأكيد الطلب 🛍️
                </button>
            </div>
        </div>
    </div>

    <!-- الفوتر -->
    <footer class="border-t border-pink-500/10 py-6 text-center text-xs text-slate-500">
        <span id="footerText">حقوق الملكيه محفوظه لدي HadoTaa</span>
    </footer>

    <!-- سكربت التشغيل المتكامل -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyArzZQUw2joSeeVkxNBVCMZfeJkKtAVnDg",
            authDomain: "esraa-gallery.firebaseapp.com",
            projectId: "esraa-gallery",
            storageBucket: "esraa-gallery.firebasestorage.app",
            messagingSenderId: "947188908804",
            appId: "1:947188908804:web:8c388e2d12f1e60df88651",
            measurementId: "G-HRH9KWKYYH"
        };

        const IMGBB_API_KEY = "d4defcf2e5a492eabffbbad7315818e2";
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [];
        let cart = [];
        let currentCategory = 'all';
        let discountPercent = 0;
        let currentLang = 'ar';

        const translations = {
            ar: {
                pageTitle: "Esraa Gallery - عالم الهدايا الراقية 💝",
                cartText: "السلة",
                bannerTitle: "جمعنا كل ما هو جميل هنا لك انت",
                searchPlaceholder: "ابحثي عن هدية معينة... 🔍",
                loadingText: "جاري تحميل الهدايا الساحرة... 🎁",
                emptyProducts: "لا يوجد هدايا الان",
                noSearch: "عذراً، لا توجد هدايا مطابقة لبحثك ✨",
                addCart: "أضف للسلة",
                closeText: "إغلاق",
                cartModalTitle: "سلة المشتريات",
                emptyCart: "سلة المشتريات فارغة تماماً 🛍️",
                couponPlaceholder: "ادخل كود الخصم",
                couponBtn: "تطبيق الخصم",
                subtotalLabel: "المجموع الفرعي:",
                discountLabel: "قيمة الخصم:",
                totalLabel: "الإجمالي الكلي:",
                custName: "الاسم بالكامل 👤",
                custPhone: "رقم الموبايل (01127073266) 📱",
                custAddress: "العنوان بالتفصيل 📍",
                orderBtn: "تأكيد الطلب 🛍️",
                footerText: "حقوق الملكيه محفوظه لدي HadoTaa",
                langBtnText: "English",
                catAll: "الكل",
                catMen: "رجالي",
                catWomen: "حريمي",
                catDecor: "ديكور",
                catOther: "أخرى",
                customNamePlaceholder: "اكتب الاسم للحفر (اختياري)... ✍️",
                uploadImgLabel: "صورة للطباعة 📷"
            },
            en: {
                pageTitle: "Esraa Gallery - Luxury Gifts World 💝",
                cartText: "Cart",
                bannerTitle: "We collected everything beautiful here for you",
                searchPlaceholder: "Search for a gift... 🔍",
                loadingText: "Loading magical gifts... 🎁",
                emptyProducts: "No gifts available now",
                noSearch: "Sorry, no gifts match your search ✨",
                addCart: "Add to Cart",
                closeText: "Close",
                cartModalTitle: "Shopping Cart",
                emptyCart: "Your shopping cart is empty 🛍️",
                couponPlaceholder: "Enter promo code",
                couponBtn: "Apply Coupon",
                subtotalLabel: "Subtotal:",
                discountLabel: "Discount:",
                totalLabel: "Total:",
                custName: "Full Name 👤",
                custPhone: "Mobile Number (01127073266) 📱",
                custAddress: "Detailed Address 📍",
                orderBtn: "Confirm Order 🛍️",
                footerText: "Copyrights reserved to HadoTaa",
                langBtnText: "عربي",
                catAll: "All",
                catMen: "Men",
                catWomen: "Women",
                catDecor: "Decor",
                catOther: "Other",
                customNamePlaceholder: "Enter name for engraving (optional)... ✍️",
                uploadImgLabel: "Image for printing 📷"
            }
        };

        window.toggleLanguage = () => {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            const htmlRoot = document.getElementById('htmlRoot');
            htmlRoot.setAttribute('lang', currentLang);
            htmlRoot.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            updateUIStrings();
            filterProducts();
            updateCartUI();
        };

        function updateUIStrings() {
            const t = translations[currentLang];
            document.getElementById('pageTitle').innerText = t.pageTitle;
            document.getElementById('cartText').innerText = t.cartText;
            document.getElementById('bannerTitle').innerText = t.bannerTitle;
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.getElementById('closeText').innerText = t.closeText;
            document.getElementById('cartModalTitle').innerText = t.cartModalTitle;
            document.getElementById('couponInput').placeholder = t.couponPlaceholder;
            document.getElementById('couponBtn').innerText = t.couponBtn;
            document.getElementById('subtotalLabel').innerText = t.subtotalLabel;
            document.getElementById('discountLabel').innerText = t.discountLabel;
            document.getElementById('totalLabel').innerText = t.totalLabel;
            document.getElementById('custName').placeholder = t.custName;
            document.getElementById('custPhone').placeholder = t.custPhone;
            document.getElementById('custAddress').placeholder = t.custAddress;
            document.getElementById('orderBtn').innerText = t.orderBtn;
            document.getElementById('footerText').innerText = t.footerText;
            document.getElementById('langBtnText').innerText = t.langBtnText;

            const cats = document.querySelectorAll('#categoryButtons button');
            if(cats.length >= 5) {
                cats[0].innerText = t.catAll;
                cats[1].innerText = `👔 ${t.catMen}`;
                cats[2].innerText = `👜 ${t.catWomen}`;
                cats[3].innerText = `🖼️ ${t.catDecor}`;
                cats[4].innerText = `🎁 ${t.catOther}`;
            }
        }

        onSnapshot(collection(db, "products"), (snapshot) => {
            const loading = document.getElementById('loading');
            if(loading) loading.style.display = 'none';
            allProducts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            filterProducts();
        }, (error) => {
            console.error("Firebase Error: ", error);
            const loading = document.getElementById('loading');
            if(loading) loading.innerHTML = `<p class="text-rose-400">⚠️ خطأ في الاتصال بقاعدة البيانات.</p>`;
        });

        window.filterCategory = (cat, btn) => {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.className = "cat-btn bg-slate-900 border border-pink-500/20 text-slate-300 px-4 py-2 rounded-xl text-xs font-bold transition hover:bg-pink-500/10";
            });
            btn.className = "cat-btn bg-pink-600 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow";
            filterProducts();
        };

        window.filterProducts = () => {
            const searchInput = document.getElementById('searchInput');
            const query = searchInput ? searchInput.value.toLowerCase().trim() : '';
            const grid = document.getElementById('productsGrid');
            if(!grid) return;

            const t = translations[currentLang];

            let filtered = allProducts.filter(p => {
                const matchesCat = currentCategory === 'all' || (p.category && p.category === currentCategory);
                const matchesSearch = p.name ? p.name.toLowerCase().includes(query) : true;
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-16 text-base font-semibold">${t.emptyProducts}</p>`;
                return;
            }

            grid.innerHTML = filtered.map(p => {
                const hasOffer = p.offerPrice && Number(p.offerPrice) < Number(p.price);
                const finalPrice = hasOffer ? p.offerPrice : p.price;

                return `
                <div class="glass-card rounded-3xl overflow-hidden flex flex-col relative group">
                    ${hasOffer ? `<span class="absolute top-3 right-3 bg-gradient-to-r from-pink-500 to-rose-500 text-white text-[11px] font-black px-3 py-1 rounded-full shadow-lg z-10 tracking-wide">عروض مميزة 🔥</span>` : ''}
                    <div class="w-full h-60 overflow-hidden bg-slate-900/50 cursor-pointer" onclick="openImageModal('${p.image}')">
                        <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between space-y-4">
                        <div>
                            <span class="text-[10px] text-pink-400 font-bold bg-pink-500/10 px-2 py-0.5 rounded-md inline-block mb-1.5">${p.category || 'أخرى'}</span>
                            <h3 class="font-bold text-base mb-2 text-slate-100 group-hover:text-pink-300 transition">${p.name}</h3>
                            <div class="flex items-center gap-3">
                                <span class="text-pink-400 font-black text-xl">${finalPrice} ج.م</span>
                                ${hasOffer ? `<span class="text-slate-500 line-through text-xs font-semibold">${p.price} ج.م</span>` : ''}
                            </div>
                        </div>
                        <button onclick="addToCart('${p.id}')" class="w-full btn-gradient py-2.5 rounded-2xl font-bold text-sm shadow-md shadow-pink-500/20 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-cart-plus"></i> ${t.addCart}
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        };

        window.openImageModal = (url) => {
            const modalImg = document.getElementById('modalImage');
            const modal = document.getElementById('imageModal');
            if(modalImg && modal) {
                modalImg.src = url;
                modal.classList.remove('hidden');
            }
        };

        window.closeImageModal = () => {
            const modal = document.getElementById('imageModal');
            if(modal) modal.classList.add('hidden');
        };

        window.addToCart = (id) => {
            const product = allProducts.find(p => p.id === id);
            if(!product) return;
            const finalPrice = (product.offerPrice && Number(product.offerPrice) < Number(product.price)) ? Number(product.offerPrice) : Number(product.price);
            
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ id: product.id, name: product.name, price: finalPrice, qty: 1, customNote: '', customImgUrl: '' });
            }
            updateCartUI();
        };

        window.removeFromCart = (index) => {
            cart.splice(index, 1);
            updateCartUI();
        };

        window.updateCartItemNote = (index, val) => {
            cart[index].customNote = val;
        };

        window.handleCartImageUpload = async (index, fileInput) => {
            const file = fileInput.files[0];
            if(!file) return;
            
            alert(currentLang === 'ar' ? "جاري رفع الصورة..." : "Uploading image...");
            try {
                const formData = new FormData();
                formData.append("image", file);
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
                const imgData = await res.json();
                
                if(imgData.success) {
                    cart[index].customImgUrl = imgData.data.url;
                    alert(currentLang === 'ar' ? "تم رفع الصورة بنجاح! ✅" : "Image uploaded successfully! ✅");
                } else {
                    alert("فشل رفع الصورة.");
                }
            } catch (e) {
                alert("حدث خطأ في رفع الصورة.");
            }
        };

        window.applyCoupon = () => {
            const couponInput = document.getElementById('couponInput');
            const msg = document.getElementById('couponMsg');
            if(!couponInput || !msg) return;

            const code = couponInput.value.trim().toUpperCase();
            if (code === "HD11") {
                discountPercent = 10;
                msg.innerText = currentLang === 'ar' ? "🎉 تم تطبيق كوبون HD11 بنجاح (خصم 10%)!" : "🎉 Coupon HD11 applied successfully (10% off)!";
                msg.classList.remove('hidden');
                msg.className = "text-xs font-semibold text-emerald-400";
            } else {
                discountPercent = 0;
                msg.innerText = currentLang === 'ar' ? "❌ كود الخصم غير صحيح!" : "❌ Invalid coupon code!";
                msg.classList.remove('hidden');
                msg.className = "text-xs font-semibold text-rose-400";
            }
            updateCartUI();
        };

        function updateCartUI() {
            const t = translations[currentLang];
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const discountVal = (subtotal * discountPercent) / 100;
            const total = subtotal - discountVal;
            
            const cartCountEl = document.getElementById('cartCount');
            const subtotalAmountEl = document.getElementById('subtotalAmount');
            if(cartCountEl) cartCountEl.innerText = count;
            if(subtotalAmountEl) subtotalAmountEl.innerText = `${subtotal} ج.م`;
            
            const discRow = document.getElementById('discountRow');
            if (discountPercent > 0 && discRow) {
                discRow.classList.remove('hidden');
                const discountAmountEl = document.getElementById('discountAmount');
                if(discountAmountEl) discountAmountEl.innerText = `-${discountVal} ج.م`;
            } else if(discRow) {
                discRow.classList.add('hidden');
            }

            const cartTotalEl = document.getElementById('cartTotal');
            if(cartTotalEl) cartTotalEl.innerText = `${total} ج.م`;

            const itemsContainer = document.getElementById('cartItems');
            if(!itemsContainer) return;

            if (cart.length === 0) {
                itemsContainer.innerHTML = `<p class="text-center text-slate-500 py-10 text-sm">${t.emptyCart}</p>`;
                return;
            }

            itemsContainer.innerHTML = cart.map((item, index) => `
                <div class="bg-slate-900/60 border border-pink-500/10 p-3.5 rounded-2xl space-y-3">
                    <div class="flex justify-between items-center">
                        <div>
                            <h4 class="font-bold text-sm text-slate-200">${item.name}</h4>
                            <span class="text-xs font-semibold text-pink-400">${item.price} ج.م × ${item.qty}</span>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-rose-400 hover:text-rose-300 w-8 h-8 rounded-xl bg-rose-500/10 flex items-center justify-center transition">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                    
                    <!-- خانة الحفر/التفاصيل ورَفْع الصورة لكل منتج -->
                    <div class="space-y-2 pt-2 border-t border-slate-800">
                        <input type="text" value="${item.customNote || ''}" oninput="updateCartItemNote(${index}, this.value)" placeholder="${t.customNamePlaceholder}" class="w-full bg-slate-950 border border-pink-500/20 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-pink-500">
                        <div class="flex items-center gap-2">
                            <label class="text-[11px] text-slate-400 bg-slate-800 px-3 py-1.5 rounded-xl cursor-pointer hover:bg-slate-700 transition flex items-center gap-1.5">
                                <i class="fa-solid fa-image text-pink-400"></i> ${t.uploadImgLabel}
                                <input type="file" accept="image/*" onchange="handleCartImageUpload(${index}, this)" class="hidden">
                            </label>
                            ${item.customImgUrl ? `<span class="text-[10px] text-emerald-400 font-bold">✓ تم رفع الصورة</span>` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.toggleCart = () => {
            const cartModal = document.getElementById('cartModal');
            if(cartModal) {
                cartModal.classList.toggle('hidden');
                updateCartUI();
            }
        };

        window.submitOrder = async () => {
            if (cart.length === 0) {
                return alert(currentLang === 'ar' ? "⚠️ سلة الهدايا فارغة!" : "⚠️ Your cart is empty!");
            }

            const nameInput = document.getElementById('custName');
            const phoneInput = document.getElementById('custPhone');
            const addressInput = document.getElementById('custAddress');

            const name = nameInput ? nameInput.value.trim() : '';
            const phone = phoneInput ? phoneInput.value.trim() : '';
            const address = addressInput ? addressInput.value.trim() : '';

            if (!name) return alert(currentLang === 'ar' ? "من فضلك أدخلي الاسم بالكامل 👤" : "Please enter your full name 👤");
            
            const egyptianPhoneRegex = /^01[0125][0-9]{8}$/;
            if (!phone || !egyptianPhoneRegex.test(phone)) {
                return alert(currentLang === 'ar' ? "⚠️ رقم الموبايل غير صحيح! يجب أن يبدأ بـ 01 ومكون من 11 رقماً" : "⚠️ Invalid Egyptian mobile number!");
            }

            if (!address) return alert(currentLang === 'ar' ? "من فضلك أدخلي العنوان بالتفصيل 📍" : "Please enter your address 📍");

            const btn = document.getElementById('orderBtn');
            if(btn) {
                btn.disabled = true;
                btn.innerText = currentLang === 'ar' ? "جاري تأكيد الطلب..." : "Confirming order...";
            }

            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const total = subtotal - ((subtotal * discountPercent) / 100);

            try {
                // حفظ الطلب في قاعدة بيانات فايربيس (بدون تحويل واتساب)
                await addDoc(collection(db, "orders"), {
                    customerName: name,
                    customerPhone: phone,
                    customerAddress: address,
                    items: cart,
                    total: total,
                    coupon: discountPercent > 0 ? "HD11" : "بدون",
                    status: "جديد",
                    createdAt: serverTimestamp()
                });

                alert(currentLang === 'ar' ? "تم تأكيد طلبك بنجاح! 💝" : "Order confirmed successfully! 💝");
                
                // إعادة ضبط السلة والصفحة ورجوعها للرئيسية
                cart = [];
                discountPercent = 0;
                document.getElementById('custName').value = '';
                document.getElementById('custPhone').value = '';
                document.getElementById('custAddress').value = '';
                document.getElementById('couponInput').value = '';
                toggleCart();
            } catch (e) {
                console.error(e);
                alert("حدث خطأ، جربي مرة أخرى.");
            } finally {
                if(btn) {
                    btn.disabled = false;
                    btn.innerText = currentLang === 'ar' ? "تأكيد الطلب 🛍️" : "Confirm Order 🛍️";
                }
            }
        };
    </script>
</body>
</html>
