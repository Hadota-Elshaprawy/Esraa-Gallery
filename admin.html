<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esraa Gallery - لوحة التحكم الفاخرة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0d0914; color: #f3e8ff; }
        .glass-box { background: rgba(26, 17, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(236, 72, 153, 0.2); }
        .btn-gradient { background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%); transition: opacity 0.2s; }
        .btn-gradient:hover { opacity: 0.9; }
    </style>
</head>
<body class="min-h-screen selection:bg-pink-500 selection:text-white">

    <!-- شاشة تسجيل الدخول (كلمة السر مخفية بنجوم) -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass-box p-8 rounded-3xl w-full max-w-sm text-center space-y-5 shadow-2xl">
            <div class="text-4xl mb-1">🔐</div>
            <h1 class="text-2xl font-black text-pink-300">Esraa Gallery Admin</h1>
            <p class="text-xs text-slate-400">لوحة تحكم صاحب المتجر الآمنة</p>
            <div class="space-y-3 pt-2">
                <input type="text" id="adminUser" placeholder="اسم المستخدم" class="w-full bg-slate-900/80 border border-pink-500/30 rounded-2xl px-4 py-3 text-center focus:outline-none focus:border-pink-500 text-white placeholder-slate-500 text-sm">
                <input type="password" id="adminPass" placeholder="كلمة المرور السرية" class="w-full bg-slate-900/80 border border-pink-500/30 rounded-2xl px-4 py-3 text-center focus:outline-none focus:border-pink-500 text-white placeholder-slate-500 text-sm">
            </div>
            <button id="loginBtn" class="w-full btn-gradient py-3.5 rounded-2xl font-bold text-white shadow-lg shadow-pink-500/20">تسجيل الدخول ✨</button>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="dashboard" class="hidden max-w-6xl mx-auto px-4 py-8 space-y-8">
        <div class="glass-box p-5 rounded-3xl flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <span class="text-2xl">⚙️</span>
                <div>
                    <h1 class="text-xl font-black text-pink-300">لوحة تحكم Esraa Gallery</h1>
                    <p class="text-xs text-slate-400" id="statsCounter">جاري تحميل الإحصائيات...</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="switchTab('orders')" id="tabOrders" class="btn-gradient px-4 py-2 rounded-xl font-bold text-xs shadow-md">الطلبات الواردة</button>
                <button onclick="switchTab('products')" id="tabProducts" class="bg-slate-900 border border-pink-500/20 px-4 py-2 rounded-xl font-bold text-xs text-slate-300">إدارة الأصناف والعروض</button>
            </div>
        </div>

        <!-- قسم الطلبات -->
        <section id="ordersSection" class="space-y-4">
            <h2 class="text-lg font-bold text-emerald-400 flex items-center gap-2"><i class="fa-solid fa-box-open"></i> أحدث الطلبات الواردة</h2>
            <div id="ordersList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </section>

        <!-- قسم إدارة الأصناف والعروض -->
        <section id="productsSection" class="hidden space-y-8">
            <div class="glass-box p-6 rounded-3xl space-y-5">
                <h2 class="text-lg font-bold text-pink-300 flex items-center gap-2"><i class="fa-solid fa-circle-plus"></i> إضافة هدية جديدة للمتجر</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="pName" placeholder="اسم الهدية" class="bg-slate-900/80 border border-pink-500/30 rounded-2xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-pink-500">
                    <input type="number" id="pPrice" placeholder="السعر الأساسي (ج.م)" class="bg-slate-900/80 border border-pink-500/30 rounded-2xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-pink-500">
                    <input type="number" id="pOffer" placeholder="سعر العرض (اختياري)" class="bg-slate-900/80 border border-pink-500/30 rounded-2xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-pink-500">
                    
                    <!-- التصنيفات الجديدة المطلوبة -->
                    <select id="pCategory" class="bg-slate-900/90 border border-pink-500/30 rounded-2xl px-4 py-3 text-sm text-pink-300 focus:outline-none focus:border-pink-500">
                        <option value="رجالي">👔 رجالي</option>
                        <option value="حريمي">👜 حريمي</option>
                        <option value="ديكور">🖼️ ديكور</option>
                        <option value="اخري">🎁 أخرى</option>
                    </select>

                    <input type="file" id="pImage" accept="image/*" class="md:col-span-2 bg-slate-900/80 border border-pink-500/30 rounded-2xl px-4 py-2.5 text-xs text-slate-300 file:mr-4 file:py-1 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-pink-500/20 file:text-pink-300">
                </div>
                <button onclick="addProduct()" id="addBtn" class="w-full btn-gradient py-3.5 rounded-2xl font-bold text-sm text-white shadow-lg shadow-pink-500/20 transition">
                    رفع الصورة وحفظ الهدية فوري 🚀
                </button>
            </div>

            <div class="space-y-4">
                <h2 class="text-lg font-bold text-pink-300 flex items-center gap-2"><i class="fa-solid fa-tags"></i> إدارة أسعار وعروض الأصناف الحالية</h2>
                <div id="adminProductsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>
        </section>
    </div>

    <!-- سكريبت الأدمن -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyArzZQUw2joSeeVkxNBVCMZfeJkKtAVnDg",
            authDomain: "esraa-gallery.firebaseapp.com",
            projectId: "esraa-gallery",
            storageBucket: "esraa-gallery.firebasestorage.app",
            messagingSenderId: "947188908804",
            appId: "1:947188908804:web:8c388e2d12f1e60df88651",
            measurementId: "G-HRH9KWKYYH"
        };

        const IMGBB_API_KEY = "d4defcf2e5a492eabffbbad7315818e2";
        const ADMIN_USER = "SOSO";
        const ADMIN_PASS = "SOSO111";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function handleLogin() {
            const userInput = document.getElementById('adminUser').value.trim();
            const passInput = document.getElementById('adminPass').value.trim();

            if (userInput === ADMIN_USER && passInput === ADMIN_PASS) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
            } else {
                alert("اسم المستخدم أو كلمة المرور غير صحيحة!");
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const loginBtn = document.getElementById('loginBtn');
            if(loginBtn) loginBtn.addEventListener('click', handleLogin);

            const passField = document.getElementById('adminPass');
            if(passField) {
                passField.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') handleLogin();
                });
            }
        });

        window.switchTab = (tab) => {
            document.getElementById('ordersSection').classList.toggle('hidden', tab !== 'orders');
            document.getElementById('productsSection').classList.toggle('hidden', tab !== 'products');
            document.getElementById('tabOrders').className = tab === 'orders' ? 'btn-gradient px-4 py-2 rounded-xl font-bold text-xs shadow-md' : 'bg-slate-900 border border-pink-500/20 px-4 py-2 rounded-xl font-bold text-xs text-slate-300';
            document.getElementById('tabProducts').className = tab === 'products' ? 'btn-gradient px-4 py-2 rounded-xl font-bold text-xs shadow-md' : 'bg-slate-900 border border-pink-500/20 px-4 py-2 rounded-xl font-bold text-xs text-slate-300';
        };

        window.addProduct = async () => {
            const name = document.getElementById('pName').value.trim();
            const price = document.getElementById('pPrice').value.trim();
            const offerPrice = document.getElementById('pOffer').value.trim();
            const category = document.getElementById('pCategory').value;
            const imageFile = document.getElementById('pImage').files[0];

            if (!name || !price || !imageFile) return alert("من فضلك أدخلي اسم الهدية، السعر، واختاري الصورة!");

            const btn = document.getElementById('addBtn');
            btn.disabled = true;
            btn.innerText = "جاري رفع الصورة وحفظ الهدية...";

            try {
                const formData = new FormData();
                formData.append("image", imageFile);
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
                const imgData = await res.json();
                
                if(!imgData.success) {
                    alert("حدث مشكلة أثناء رفع الصورة.");
                    btn.disabled = false;
                    btn.innerText = "رفع الصورة وحفظ الهدية فوري 🚀";
                    return;
                }

                await addDoc(collection(db, "products"), {
                    name: name,
                    price: Number(price),
                    offerPrice: offerPrice ? Number(offerPrice) : null,
                    category: category,
                    image: imgData.data.url
                });

                alert("تم إضافة الهدية بنجاح! 💝");
                document.getElementById('pName').value = '';
                document.getElementById('pPrice').value = '';
                document.getElementById('pOffer').value = '';
                document.getElementById('pImage').value = '';
            } catch (e) {
                alert("حدث خطأ في الاتصال.");
            } finally {
                btn.disabled = false;
                btn.innerText = "رفع الصورة وحفظ الهدية فوري 🚀";
            }
        };

        onSnapshot(collection(db, "products"), (snapshot) => {
            const list = document.getElementById('adminProductsList');
            window.totalProductsCount = snapshot.size;
            updateStatsText();

            if(snapshot.empty) {
                list.innerHTML = `<p class="col-span-full text-slate-500 text-sm">لا توجد أصناف مضافة حالياً.</p>`;
                return;
            }
            list.innerHTML = snapshot.docs.map(docSnap => {
                const p = docSnap.data();
                const id = docSnap.id;
                return `
                <div class="glass-box p-4 rounded-2xl flex gap-4 items-center">
                    <img src="${p.image}" class="w-20 h-20 object-cover rounded-xl bg-slate-900 border border-pink-500/20">
                    <div class="flex-1 space-y-2">
                        <h3 class="font-bold text-sm text-slate-200">${p.name} <span class="text-[10px] text-pink-400">(${p.category || 'أخرى'})</span></h3>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[10px] text-slate-400 block">السعر</label>
                                <input type="number" id="price_${id}" value="${p.price}" class="w-full bg-slate-900 border border-pink-500/20 rounded-lg px-2 py-1 text-xs text-white">
                            </div>
                            <div>
                                <label class="text-[10px] text-pink-400 block font-bold">العرض</label>
                                <input type="number" id="offer_${id}" value="${p.offerPrice || ''}" placeholder="بدون" class="w-full bg-slate-900 border border-pink-500/20 rounded-lg px-2 py-1 text-xs text-pink-300">
                            </div>
                        </div>
                        <div class="flex gap-2 pt-1">
                            <button onclick="updateProduct('${id}')" class="btn-gradient text-xs px-3 py-1.5 rounded-lg font-bold text-white shadow">حفظ</button>
                            <button onclick="deleteProduct('${id}')" class="bg-rose-500/10 text-rose-400 hover:bg-rose-500 hover:text-white text-xs px-3 py-1.5 rounded-lg transition">حذف</button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        });

        const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const ordersList = document.getElementById('ordersList');
            window.totalOrdersCount = snapshot.size;
            updateStatsText();

            if (snapshot.empty) {
                ordersList.innerHTML = `<p class="text-slate-500 text-sm">لا توجد طلبات حتى الآن.</p>`;
                return;
            }
            ordersList.innerHTML = snapshot.docs.map(docSnap => {
                const o = docSnap.data();
                const id = docSnap.id;
                const itemsHtml = o.items.map(i => `<li>• ${i.name} (×${i.qty}) - ${i.price * i.qty} ج.م</li>`).join('');
                return `
                <div class="glass-box p-5 rounded-2xl space-y-3 border-l-4 ${o.status === 'جديد' ? 'border-l-pink-500' : 'border-l-slate-700'}">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-bold text-base text-pink-300">${o.customerName}</h3>
                            <p class="text-xs text-slate-300">📱 ${o.customerPhone}</p>
                            <p class="text-xs text-slate-400">📍 ${o.customerAddress}</p>
                            ${o.coupon ? `<p class="text-[11px] text-emerald-400 mt-1">🎟️ مستخدم كوبون: ${o.coupon}</p>` : ''}
                        </div>
                        <span class="px-3 py-1 rounded-full text-[11px] font-bold ${o.status === 'جديد' ? 'bg-pink-500/20 text-pink-300 border border-pink-500/30' : 'bg-slate-900 text-slate-400'}">
                            ${o.status}
                        </span>
                    </div>
                    <ul class="bg-slate-950/60 p-3 rounded-xl text-xs space-y-1 text-slate-300 border border-pink-500/10">${itemsHtml}</ul>
                    <div class="flex justify-between items-center pt-2">
                        <span class="font-black text-pink-400 text-sm">الإجمالي: ${o.total} ج.م</span>
                        <div class="flex gap-2">
                            ${o.status === 'جديد' ? `<button onclick="markDone('${id}')" class="btn-gradient text-xs px-3 py-1.5 rounded-lg font-bold text-white shadow">تم التسليم ✓</button>` : ''}
                            <button onclick="deleteOrder('${id}')" class="bg-rose-500/10 text-rose-400 hover:bg-rose-500 hover:text-white text-xs px-3.5 py-1.5 rounded-lg transition">مسح</button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        });

        function updateStatsText() {
            const pCount = window.totalProductsCount || 0;
            const oCount = window.totalOrdersCount || 0;
            const counterEl = document.getElementById('statsCounter');
            if(counterEl) {
                counterEl.innerText = `إجمالي الهدايا: ${pCount} | الطلبات الواردة: ${oCount}`;
            }
        }

        window.updateProduct = async (id) => {
            const newPrice = document.getElementById(`price_${id}`).value;
            const newOffer = document.getElementById(`offer_${id}`).value;
            
            await updateDoc(doc(db, "products", id), {
                price: Number(newPrice),
                offerPrice: newOffer ? Number(newOffer) : null
            });
            alert("تم التحديث بنجاح! ✨");
        };

        window.deleteProduct = async (id) => {
            if (confirm("هل أنت متأكدة من حذف هذا الصنف نهائياً؟")) {
                await deleteDoc(doc(db, "products", id));
            }
        };

        window.markDone = async (id) => {
            await updateDoc(doc(db, "orders", id), { status: "تم التسليم" });
        };

        window.deleteOrder = async (id) => {
            if (confirm("مسح سجل الطلب؟")) await deleteDoc(doc(db, "orders", id));
        };
    </script>
</body>
</html>
